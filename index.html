ospace; font-size:12px; letter-spacing:0.2em; color:var(--accent,#DA4C0F); vertical-align:super; margin-right:14px;\">03<\u002Fspan>Contact<\u002Fa>\n    <\u002Fnav>\n    <div style=\"padding:0 clamp(20px,5vw,64px) 40px; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.16em; color:#798573;\">GRC ANALYST.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== HERO — portrait left, headline right / overlap ===== -->\n  <header id=\"top\" style=\"position:relative; min-height:100vh; display:flex; align-items:flex-end; overflow:hidden;\">\n    <div style=\"position:absolute; left:0; top:0; bottom:0; width:64%; max-width:940px;\">\n      <img src=\"9a9c394d-fefb-429d-806e-e5214d12c325\" alt=\"Dara Thomas\" style=\"position:absolute; left:-4%; bottom:0; height:100%; max-height:100vh; width:auto; object-fit:contain; object-position:bottom left; filter:grayscale(1) contrast(1.05);\">\n      <div style=\"position:absolute; inset:0; background:linear-gradient(to bottom, transparent 62%, rgba(0,0,0,0.4) 84%, #000 100%); pointer-events:none;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative; z-index:3; width:100%; padding:0 clamp(20px,5vw,64px) clamp(56px,10vh,120px); display:flex; flex-direction:column; align-items:flex-end; text-align:right;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.3em; color:var(--accent,#DA4C0F); margin-bottom:24px;\">GOVERNANCE · RISK · COMPLIANCE<\u002Fdiv>\n      <h1 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:0; line-height:0.84; letter-spacing:-0.01em; font-size:clamp(2.8rem,9vw,9.5rem);\">\n        <span style=\"display:block; animation:wordUp 600ms cubic-bezier(0.22,1,0.36,1) both; animation-delay:120ms;\">“Unsafe” isn't<\u002Fspan>\n        <span style=\"display:block; color:#545E4F; animation:wordUp 600ms cubic-bezier(0.22,1,0.36,1) both; animation-delay:280ms;\">human error.<\u002Fspan>\n        <span style=\"display:block; margin-top:0.08em; animation:wordUp 600ms cubic-bezier(0.22,1,0.36,1) both; animation-delay:460ms;\">It's a <span style=\"color:var(--accent,#DA4C0F);\">design<\u002Fspan><\u002Fspan>\n        <span style=\"display:block; color:var(--accent,#DA4C0F); animation:wordUp 600ms cubic-bezier(0.22,1,0.36,1) both; animation-delay:620ms;\">flaw<span style=\"color:#798573;\">.<\u002Fspan><\u002Fspan>\n      <\u002Fh1>\n      <p style=\"max-width:40ch; margin:34px 0 0; color:#F9EBC3; font-size:clamp(15px,1.4vw,18px); line-height:1.55; animation:wordUp 700ms ease-out both; animation-delay:820ms;\">\n        I build governance, risk &amp; compliance programs for how people <em style=\"color:#798573; font-style:italic;\">actually behave<\u002Fem> - auditable controls and secure-by-design thinking. Cloud security is where I'm headed next.\n      <\u002Fp>\n      <div style=\"margin-top:34px; display:flex; flex-wrap:wrap; gap:14px; justify-content:flex-end; animation:wordUp 700ms ease-out both; animation-delay:1000ms;\">\n        <a href=\"#resume\" style=\"text-decoration:none; display:inline-flex; align-items:center; gap:12px; background:var(--accent,#DA4C0F); color:#000; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; font-weight:700; padding:15px 26px;\" style-hover=\"background:#798573;\">View My Resume →<\u002Fa>\n        <a href=\"#work\" style=\"text-decoration:none; display:inline-flex; align-items:center; gap:12px; background:transparent; color:var(--accent,#DA4C0F); border:1px solid var(--accent,#DA4C0F); font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; font-weight:700; padding:14px 25px;\" style-hover=\"background:var(--accent,#DA4C0F); color:#000;\">View My Projects →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"scroll-cue\" style=\"position:absolute; left:clamp(20px,5vw,64px); bottom:24px; z-index:4; display:flex; align-items:center; gap:14px;\">\n      <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.24em; color:#798573; animation:cueBob 2.2s ease-in-out infinite;\">SCROLL<\u002Fspan>\n      <span style=\"display:block; width:1px; height:40px; background:linear-gradient(#798573, transparent);\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ===== POSITIONING STRIP ===== -->\n  <section id=\"positioning\" style=\"padding:clamp(90px,16vh,180px) clamp(20px,5vw,64px); border-top:1px solid #1a1a1a;\">\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(30px); transition:opacity 600ms ease-out, transform 600ms cubic-bezier(0.22,1,0.36,1); max-width:1100px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.3em; color:#798573; margin-bottom:40px;\">01 — POSITIONING<\u002Fdiv>\n      <p style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; line-height:0.98; letter-spacing:-0.005em; font-size:clamp(1.9rem,5vw,4.6rem); margin:0; color:#798573;\">\n        Most security programs train people to work around <span style=\"color:#545E4F;\">bad design.<\u002Fspan>\n        <span style=\"color:var(--accent,#DA4C0F);\">I design systems so they don't have to<span style=\"color:#798573;\">.<\u002Fspan><\u002Fspan>\n      <\u002Fp>\n      <p style=\"max-width:56ch; margin:44px 0 0; color:#F9EBC3; font-size:clamp(16px,1.5vw,19px); line-height:1.65;\">\n        Effective security happens when technology, process, and people are designed to work together <em style=\"color:#798573; font-style:italic;\">(not when people are trained to work around bad design)<\u002Fem>. I translate that conviction into frameworks, controls, and audit-ready evidence.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== WHY I'M DIFFERENT ===== -->\n  <section style=\"border-top:1px solid #1a1a1a; padding:clamp(64px,12vh,120px) clamp(20px,5vw,64px);\">\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(30px); transition:opacity 600ms ease-out, transform 600ms cubic-bezier(0.22,1,0.36,1); margin-bottom:clamp(44px,7vh,72px); max-width:900px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.3em; color:#798573; margin-bottom:30px;\">02 — WHY I'M DIFFERENT<\u002Fdiv>\n      <h2 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:0; line-height:0.92; letter-spacing:-0.01em; font-size:clamp(2rem,6vw,5rem); color:#798573;\">Four disciplines.<br><span style=\"color:var(--accent,#DA4C0F);\">One lens on risk<span style=\"color:#798573;\">.<\u002Fspan><\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"grid-2\" style=\"background:#1a1a1a; border:1px solid #1a1a1a;\">\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(24px); transition:opacity 600ms ease-out, transform 600ms cubic-bezier(0.22,1,0.36,1); background:#000; padding:clamp(32px,3.5vw,52px); display:flex; flex-direction:column; min-height:260px;\">\n        <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:var(--accent,#DA4C0F); margin-bottom:auto;\">01<\u002Fspan>\n        <h3 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:48px 0 0; font-size:clamp(1.4rem,2vw,1.9rem); line-height:1; letter-spacing:-0.005em; color:#798573;\">Occupational Health <span style=\"color:#F9EBC3;\">&amp;<\u002Fspan> Safety<\u002Fh3>\n        <p style=\"margin:16px 0 0; color:#F9EBC3; font-size:15px; line-height:1.55;\">Hazard identification, investigations, and policy built to anticipate failure before it happens.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(24px); transition:opacity 600ms ease-out 80ms, transform 600ms cubic-bezier(0.22,1,0.36,1) 80ms; background:#000; padding:clamp(32px,3.5vw,52px); display:flex; flex-direction:column; min-height:260px;\">\n        <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:var(--accent,#DA4C0F); margin-bottom:auto;\">02<\u002Fspan>\n        <h3 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:48px 0 0; font-size:clamp(1.4rem,2vw,1.9rem); line-height:1; letter-spacing:-0.005em; color:#798573;\">UX Design <span style=\"color:#F9EBC3;\">&amp;<\u002Fspan> Research<\u002Fh3>\n        <p style=\"margin:16px 0 0; color:#F9EBC3; font-size:15px; line-height:1.55;\">Reading user behavior, stakeholder needs, and complex systems to find where they actually break.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(24px); transition:opacity 600ms ease-out 160ms, transform 600ms cubic-bezier(0.22,1,0.36,1) 160ms; background:#000; padding:clamp(32px,3.5vw,52px); display:flex; flex-direction:column; min-height:260px;\">\n        <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:var(--accent,#DA4C0F); margin-bottom:auto;\">03<\u002Fspan>\n        <h3 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:48px 0 0; font-size:clamp(1.4rem,2vw,1.9rem); line-height:1; letter-spacing:-0.005em; color:#798573;\">Systems Thinking<\u002Fh3>\n        <p style=\"margin:16px 0 0; color:#F9EBC3; font-size:15px; line-height:1.55;\">People, process, and technology aren't silos - they're one system that succeeds or fails together.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(24px); transition:opacity 600ms ease-out 240ms, transform 600ms cubic-bezier(0.22,1,0.36,1) 240ms; background:#000; padding:clamp(32px,3.5vw,52px); display:flex; flex-direction:column; min-height:260px;\">\n        <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:var(--accent,#DA4C0F); margin-bottom:auto;\">04<\u002Fspan>\n        <h3 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:48px 0 0; font-size:clamp(1.4rem,2vw,1.9rem); line-height:1; letter-spacing:-0.005em; color:#798573;\">Human Risk <span style=\"color:#F9EBC3;\">&amp;<\u002Fspan> Behavior<\u002Fh3>\n        <p style=\"margin:16px 0 0; color:#F9EBC3; font-size:15px; line-height:1.55;\">Why people make the security decisions they do - and designing controls around that reality, not against it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== FEATURED CASE STUDY ===== -->\n  <section style=\"position:relative; border-top:1px solid #1a1a1a;\">\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(30px); transition:opacity 700ms ease-out, transform 700ms cubic-bezier(0.22,1,0.36,1); padding:clamp(64px,12vh,120px) clamp(20px,5vw,64px);\">\n      <div style=\"display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:clamp(40px,7vh,80px);\">\n        <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.3em; color:var(--accent,#DA4C0F);\">03 — FEATURED CASE STUDY<\u002Fdiv>\n        <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.2em; color:#798573;\">ISO 27001 · HIPAA · NIST CSF<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cs-grid\" style=\"display:grid; grid-template-columns:repeat(12,1fr); gap:clamp(24px,4vw,56px); align-items:end;\">\n        <div style=\"grid-column:1 / span 8;\">\n          <h2 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:0; line-height:0.88; letter-spacing:-0.01em; font-size:clamp(3rem,10vw,10rem); color:#798573;\">OccuSafe<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"grid-column:9 / span 4;\">\n          <p style=\"margin:0; color:#F9EBC3; font-size:clamp(15px,1.4vw,18px); line-height:1.6;\">\n            A workplace-safety platform, secured. I treated <em style=\"color:#798573; font-style:italic;\">\"human error\"<\u002Fem> as a system-design gap - not a compliance checkbox - and mapped it to auditable controls across three frameworks.\n          <\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1px; background:#1a1a1a; border:1px solid #1a1a1a; margin-top:clamp(40px,7vh,72px);\">\n        <sc-for list=\"{{ caseStats }}\" as=\"stat\" hint-placeholder-count=\"4\">\n          <div style=\"background:#000; padding:32px 28px;\">\n            <div style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; font-size:clamp(2.4rem,4vw,3.6rem); line-height:0.9; color:var(--accent,#DA4C0F);\">{{ stat.value }}<\u002Fdiv>\n            <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.14em; color:#798573; margin-top:14px; text-transform:uppercase;\">{{ stat.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <a href=\"https://github.com/DaraStaysCurious/grc-occusafe-iso27001\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex; align-items:center; gap:12px; margin-top:44px; text-decoration:none; color:#798573; font-family:'Space Mono',monospace; font-size:13px; letter-spacing:0.18em; border-bottom:2px solid var(--accent,#DA4C0F); padding-bottom:6px;\" style-hover=\"color:var(--accent,#DA4C0F);\">READ THE FULL BREAKDOWN →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== PROJECT GRID ===== -->\n  <section id=\"work\" style=\"border-top:1px solid #1a1a1a; padding:clamp(64px,12vh,120px) clamp(20px,5vw,64px);\">\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(30px); transition:opacity 600ms ease-out, transform 600ms cubic-bezier(0.22,1,0.36,1); display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:clamp(40px,7vh,72px);\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.3em; color:#798573;\">04 — GRC PROJECTS<\u002Fdiv>\n      <h2 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:0; font-size:clamp(2rem,5vw,4rem); line-height:0.9; color:#798573;\">GRC Projects<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"grid-3\" style=\"background:#1a1a1a; border:1px solid #1a1a1a;\">\n      <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <a href=\"{{ p.href }}\" target=\"{{ p.target }}\" rel=\"noopener\" data-reveal=\"\" style=\"opacity:0; transform:translateY(24px); transition:opacity 600ms ease-out, transform 600ms cubic-bezier(0.22,1,0.36,1); text-decoration:none; background:#000; padding:clamp(28px,3vw,40px); display:flex; flex-direction:column; min-height:300px;\" style-hover=\"background:#0b0b0b;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:auto;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:#5c5c5c;\">{{ p.num }}<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; padding:5px 10px; border:1px solid {{ p.statusBorder }}; color:{{ p.statusColor }};\">{{ p.status }}<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:56px 0 0; font-size:clamp(1.5rem,2.2vw,2.1rem); line-height:0.98; letter-spacing:-0.005em; color:#798573;\">{{ p.name }}<\u002Fh3>\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.12em; color:var(--accent,#DA4C0F); margin-top:14px; text-transform:uppercase;\">{{ p.standard }}<\u002Fdiv>\n          <p style=\"margin:16px 0 0; color:#F9EBC3; font-size:14px; line-height:1.55;\">{{ p.blurb }}<\u002Fp>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== CLOUD SECURITY LABS ===== -->\n  <section style=\"border-top:1px solid #1a1a1a; padding:clamp(64px,12vh,120px) clamp(20px,5vw,64px);\">\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(30px); transition:opacity 600ms ease-out, transform 600ms cubic-bezier(0.22,1,0.36,1);\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:26px;\">\n        <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.3em; color:#798573;\">05 — CLOUD SECURITY LABS<\u002Fdiv>\n        <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; font-weight:700; color:#000; background:var(--accent,#DA4C0F); padding:6px 12px;\">Coming Soon<\u002Fdiv>\n      <\u002Fdiv>\n      <h2 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:0 0 20px; font-size:clamp(2rem,5vw,4rem); line-height:0.9; letter-spacing:-0.01em; color:#798573;\">The Next Chapter<\u002Fh2>\n      <p style=\"max-width:54ch; margin:0 0 clamp(40px,6vh,64px); color:#F9EBC3; font-size:clamp(15px,1.4vw,18px); line-height:1.6;\">Hands-on AWS security labs - currently in build. Where the GRC discipline meets the cloud controls that enforce it. Not expertise I'm claiming yet; the work I'm doing next.<\u002Fp>\n      <div class=\"grid-3\" style=\"gap:16px;\">\n        <div style=\"border:1px dashed #2a2a2a; padding:clamp(26px,3vw,34px); min-height:168px; display:flex; flex-direction:column;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:auto;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:#5c5c5c;\">L01<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:#5c5c5c;\">Coming Soon<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:34px 0 0; font-size:clamp(1.2rem,1.7vw,1.55rem); line-height:1.02; letter-spacing:-0.005em; color:#798573;\">IAM <span style=\"color:#F9EBC3;\">&amp;<\u002Fspan> Least Privilege<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"border:1px dashed #2a2a2a; padding:clamp(26px,3vw,34px); min-height:168px; display:flex; flex-direction:column;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:auto;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:#5c5c5c;\">L02<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:#5c5c5c;\">Coming Soon<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:34px 0 0; font-size:clamp(1.2rem,1.7vw,1.55rem); line-height:1.02; letter-spacing:-0.005em; color:#798573;\">Data Protection <span style=\"color:#F9EBC3;\">&amp;<\u002Fspan> Encryption<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"border:1px dashed #2a2a2a; padding:clamp(26px,3vw,34px); min-height:168px; display:flex; flex-direction:column;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:auto;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:#5c5c5c;\">L03<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:#5c5c5c;\">Coming Soon<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:34px 0 0; font-size:clamp(1.2rem,1.7vw,1.55rem); line-height:1.02; letter-spacing:-0.005em; color:#798573;\">Threat Detection <span style=\"color:#F9EBC3;\">&amp;<\u002Fspan> Monitoring<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"border:1px dashed #2a2a2a; padding:clamp(26px,3vw,34px); min-height:168px; display:flex; flex-direction:column;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:auto;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:#5c5c5c;\">L04<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:#5c5c5c;\">Coming Soon<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:34px 0 0; font-size:clamp(1.2rem,1.7vw,1.55rem); line-height:1.02; letter-spacing:-0.005em; color:#798573;\">Incident Response <span style=\"color:#F9EBC3;\">&amp;<\u002Fspan> Root Cause Analysis<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"border:1px dashed #2a2a2a; padding:clamp(26px,3vw,34px); min-height:168px; display:flex; flex-direction:column;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:auto;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:#5c5c5c;\">L05<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:#5c5c5c;\">Coming Soon<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:34px 0 0; font-size:clamp(1.2rem,1.7vw,1.55rem); line-height:1.02; letter-spacing:-0.005em; color:#798573;\">Logging <span style=\"color:#F9EBC3;\">&amp;<\u002Fspan> Audit Trails<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"border:1px dashed #2a2a2a; padding:clamp(26px,3vw,34px); min-height:168px; display:flex; flex-direction:column;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:auto;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:12px; color:#5c5c5c;\">L06<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:#5c5c5c;\">Coming Soon<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:34px 0 0; font-size:clamp(1.2rem,1.7vw,1.55rem); line-height:1.02; letter-spacing:-0.005em; color:#798573;\">Compliance as Code<\u002Fh3>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== WRITING & INSIGHTS ===== -->\n  <section style=\"border-top:1px solid #1a1a1a; padding:clamp(64px,12vh,120px) clamp(20px,5vw,64px);\">\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(30px); transition:opacity 600ms ease-out, transform 600ms cubic-bezier(0.22,1,0.36,1);\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.3em; color:#798573; margin-bottom:26px;\">06 — WRITING &amp; INSIGHTS<\u002Fdiv>\n      <h2 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:0 0 24px; font-size:clamp(2rem,5vw,4rem); line-height:0.9; letter-spacing:-0.01em; color:#798573;\">Field Notes<\u002Fh2>\n      <p style=\"max-width:70ch; margin:0 0 clamp(40px,6vh,64px); color:#F9EBC3; font-size:clamp(15px,1.4vw,18px); line-height:1.65;\">Writing is one of the ways I deepen my understanding of cybersecurity and contribute to the broader conversation around security, risk, and technology. These articles range from governance and cloud security to human-centered design and secure-by-design principles - reflecting my belief that effective security requires more than technical controls: it requires clear communication, thoughtful decision-making, and an understanding of how people interact with systems.<\u002Fp>\n      <div class=\"grid-2\" style=\"gap:16px;\">\n        <sc-for list=\"{{ articles }}\" as=\"a\" hint-placeholder-count=\"4\">\n          <a href=\"{{ a.href }}\" target=\"_blank\" rel=\"noopener\" data-reveal=\"\" style=\"opacity:0; transform:translateY(24px); transition:opacity 600ms ease-out, transform 600ms cubic-bezier(0.22,1,0.36,1); text-decoration:none; background:#000; border:1px solid #1a1a1a; padding:clamp(28px,3vw,40px); display:flex; flex-direction:column; min-height:240px;\" style-hover=\"background:#0b0b0b;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.16em; color:#5c5c5c; text-transform:uppercase;\">{{ a.num }} — Essay<\u002Fspan>\n            <h3 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:24px 0 0; font-size:clamp(1.3rem,1.9vw,1.8rem); line-height:1.04; letter-spacing:-0.005em; color:#798573;\">{{ a.title }}<\u002Fh3>\n            <p style=\"margin:16px 0 26px; color:#F9EBC3; font-size:14px; line-height:1.55;\">{{ a.desc }}<\u002Fp>\n            <span style=\"margin-top:auto; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent,#DA4C0F);\">Read this article →<\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== BIO + CERTS ===== -->\n  <section id=\"about\" style=\"border-top:1px solid #1a1a1a; padding:clamp(64px,12vh,120px) clamp(20px,5vw,64px);\">\n    <div class=\"bio-grid\" style=\"display:grid; grid-template-columns:repeat(12,1fr); gap:clamp(24px,4vw,56px);\">\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(30px); transition:opacity 700ms ease-out, transform 700ms cubic-bezier(0.22,1,0.36,1); grid-column:1 / span 7;\">\n        <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.3em; color:#798573; margin-bottom:36px;\">07 — BIO<\u002Fdiv>\n        <p style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:0 0 32px; font-size:clamp(1.8rem,4vw,3.2rem); line-height:0.98; color:#798573;\"><span style=\"color:var(--accent,#DA4C0F);\">Hi, I'm Dara<span style=\"color:#798573;\">.<\u002Fspan><\u002Fspan> I study <span style=\"color:#545E4F;\">how systems fail<\u002Fspan> when humans are involved.<\u002Fp>\n        <div style=\"max-width:62ch; color:#F9EBC3; font-size:clamp(15px,1.4vw,17px); line-height:1.7; display:flex; flex-direction:column; gap:18px;\">\n          <p style=\"margin:0;\"><strong style=\"color:#F9EBC3; font-weight:600;\">First, occupational health &amp; safety.<\u002Fstrong> A decade taught me risk assessment is a discipline, not a checklist - and that the most dangerous vulnerabilities are rarely the ones that look dangerous on paper. They're the ones embedded in how people actually work.<\u002Fp>\n          <p style=\"margin:0;\"><strong style=\"color:#F9EBC3; font-weight:600;\">Then, B2B SaaS product design.<\u002Fstrong> I ran research studies, mapped user journeys, found where systems broke down, and redesigned around real behavior - not assumed behavior. I got good at translating complexity for people who didn't have a technical vocabulary for it.<\u002Fp>\n          <p style=\"margin:0;\"><strong style=\"color:#F9EBC3; font-weight:600;\">Now, governance, risk &amp; compliance.<\u002Fstrong> CompTIA Security+ and ongoing GRC study gave me the framework language to bring it all together - speaking fluently across risk assessment, compliance controls, and the human factors that determine whether any of it works in practice.<\u002Fp>\n          <p style=\"margin:0; color:#F9EBC3;\">GRC isn't a pivot <em style=\"font-style:italic; color:#F9EBC3;\">(it's where all three converge)<\u002Fem>.<\u002Fp>\n          <p style=\"margin:0;\">I believe the most durable security programs aren't built by tightening controls until people route around them. They're built by <em style=\"color:#F9EBC3; font-style:italic;\">designing controls people can actually use<\u002Fem>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(30px); transition:opacity 700ms ease-out 120ms, transform 700ms cubic-bezier(0.22,1,0.36,1) 120ms; grid-column:9 / span 4;\" class=\"bio-side\">\n        <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.3em; color:#798573; margin-bottom:36px;\">CERTIFICATIONS<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column;\">\n          <sc-for list=\"{{ certs }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:22px 0; border-top:1px solid #1a1a1a;\">\n              <span style=\"font-family:'Nunito Sans',sans-serif; font-weight:600; font-size:15px; color:#798573; line-height:1.35;\">{{ c.name }}<\u002Fspan>\n              <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; white-space:nowrap; color:{{ c.color }}; font-weight:{{ c.weight }};\">{{ c.status }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:40px;\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.3em; color:#798573; margin-bottom:6px;\">BACKGROUND<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column;\">\n            <sc-for list=\"{{ background }}\" as=\"b\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:22px 0; border-top:1px solid #1a1a1a;\">\n                <span style=\"font-family:'Nunito Sans',sans-serif; font-weight:600; font-size:15px; color:#798573; line-height:1.35;\">{{ b.name }}<\u002Fspan>\n                <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; white-space:nowrap; color:#5c5c5c;\">{{ b.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:40px;\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.3em; color:#798573; margin-bottom:22px;\">CURRENTLY LEARNING<\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; color:#798573; border:1px solid #2a2a2a; padding:7px 12px;\">AWS Security Services<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; color:#798573; border:1px solid #2a2a2a; padding:7px 12px;\">NIST RMF<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; color:#798573; border:1px solid #2a2a2a; padding:7px 12px;\">Cloud Security Architecture<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; color:#798573; border:1px solid #2a2a2a; padding:7px 12px;\">Vendor Risk Management<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; color:#798573; border:1px solid #2a2a2a; padding:7px 12px;\">Python for Security Automation<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; color:#798573; border:1px solid #2a2a2a; padding:7px 12px;\">Linux<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; color:#798573; border:1px solid #2a2a2a; padding:7px 12px;\">IAM &amp; Identity Governance<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== CONTACT / CTA ===== -->\n  <section id=\"contact\" style=\"border-top:1px solid #1a1a1a; padding:clamp(80px,15vh,180px) clamp(20px,5vw,64px) clamp(48px,8vh,80px);\">\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(30px); transition:opacity 700ms ease-out, transform 700ms cubic-bezier(0.22,1,0.36,1);\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.3em; color:var(--accent,#DA4C0F); margin-bottom:40px;\">08 — CONTACT<\u002Fdiv>\n      <h2 style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; text-transform:uppercase; margin:0; line-height:0.86; letter-spacing:-0.01em; font-size:clamp(2.6rem,10vw,9rem); color:#798573;\">Let's build<br>security that<br><span style=\"color:var(--accent,#DA4C0F);\">fits humans<span style=\"color:#798573;\">.<\u002Fspan><\u002Fspan><\u002Fh2>\n      <p style=\"max-width:52ch; margin:40px 0 56px; color:#F9EBC3; font-size:clamp(16px,1.5vw,19px); line-height:1.6;\">\n        Open to fully-remote GRC analyst roles - and fractional consulting.\n      <\u002Fp>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:1px; background:#1a1a1a; border:1px solid #1a1a1a;\">\n        <sc-for list=\"{{ links }}\" as=\"l\" hint-placeholder-count=\"4\">\n          <a href=\"{{ l.href }}\" target=\"_blank\" rel=\"noopener\" style=\"background:#000; text-decoration:none; padding:28px; display:flex; flex-direction:column; gap:8px;\" style-hover=\"background:#0b0b0b;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.22em; color:#5c5c5c; text-transform:uppercase;\">{{ l.label }}<\u002Fspan>\n            <span style=\"font-family:'Nunito Sans',sans-serif; font-weight:600; font-size:16px; color:#798573; word-break:break-word;\">{{ l.value }} <span style=\"color:var(--accent,#DA4C0F);\">→<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <footer style=\"display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-top:clamp(48px,9vh,96px); padding-top:28px; border-top:1px solid #1a1a1a;\">\n      <span style=\"font-family:'Century Gothic','Jost',sans-serif; font-weight:500; font-size:16px; letter-spacing:0.04em; color:#798573;\">DARA THOMAS<\u002Fspan>\n      <a href=\"https://darastayscurious.substack.com/\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.14em; color:#798573; border-bottom:1px solid var(--accent,#DA4C0F); padding-bottom:4px;\" style-hover=\"color:var(--accent,#DA4C0F);\">READ MORE OF MY WRITING ON SUBSTACK →<\u002Fa>\n      <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.16em; color:#5c5c5c;\">© 2026 Dara F. Thomas<\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#DA4C0F&quot;,&quot;options&quot;:[&quot;#DA4C0F&quot;,&quot;#EB5939&quot;,&quot;#798573&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;}}\">\nclass Component extends DCLogic {\n  state = { menuOpen: false };\n  toggleMenu = () => this.setState((s) => ({ menuOpen: !s.menuOpen }));\n  closeMenu = () => this.setState({ menuOpen: false });\n\n  setupReveal = () => {\n    if (this._io) this._io.disconnect();\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) {\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'none';\n          this._io.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n    document.querySelectorAll('[data-reveal]').forEach((el) => {\n      const r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight * 0.92) {\n        el.style.opacity = '1';\n        el.style.transform = 'none';\n      } else {\n        this._io.observe(el);\n      }\n    });\n  };\n  componentDidMount() { requestAnimationFrame(() => this.setupReveal()); }\n  componentDidUpdate() { requestAnimationFrame(() => this.setupReveal()); }\n  componentWillUnmount() { if (this._io) this._io.disconnect(); }\n\n  renderVals() {\n    const accent = this.props.accentColor ?? '#DA4C0F';\n    const stone = '#798573';\n    const open = this.state.menuOpen;\n    return {\n      accent,\n      toggleMenu: this.toggleMenu,\n      closeMenu: this.closeMenu,\n      overlayStyle: {\n        position: 'fixed', inset: 0, zIndex: 60, background: '#000',\n        display: 'flex', flexDirection: 'column',\n        opacity: open ? 1 : 0,\n        pointerEvents: open ? 'auto' : 'none',\n        transform: open ? 'translateY(0)' : 'translateY(-8px)',\n        transition: 'opacity 340ms ease-out, transform 340ms cubic-bezier(0.22,1,0.36,1)',\n      },\n      caseStats: [\n        { value: '3', label: 'Frameworks mapped' },\n        { value: '27001', label: 'ISO controls scoped' },\n        { value: '100%', label: 'Controls traced to evidence' },\n        { value: '0', label: 'Checkboxes for their own sake' },\n      ],\n      certs: [\n        { name: 'CompTIA Security+', status: 'Certified', color: accent, weight: 700 },\n        { name: 'AWS Certified Cloud Practitioner', status: 'In progress', color: stone, weight: 400 },\n        { name: 'CGE-P - Certified GRC Engineer, Practitioner', status: 'In progress', color: stone, weight: 400 },\n      ],\n      background: [\n        { name: 'B2B SaaS Product Design', note: 'Prior career' },\n        { name: 'Occupational Health & Safety', note: 'Prior career' },\n      ],\n      articles: [\n        { num: '01', title: 'Trust Is the Product: What GRC Professionals Are Actually Building', desc: 'Why governance, risk, and compliance are about creating trust between organizations, customers, regulators, and stakeholders - not just satisfying requirements.', href: 'https://darastayscurious.substack.com/p/trust-is-the-product' },\n        { num: '02', title: 'Governance Fails When Nobody Understands the System', desc: 'How governance breaks down when complexity outpaces shared understanding, leaving organizations with policies and processes that no longer reflect operational reality.', href: 'https://darastayscurious.substack.com/p/governance-fails-when-nobody-understands' },\n        { num: '03', title: 'Cloud Misconfigurations Are Usually Organizational Problems', desc: 'A systems-thinking perspective on why many cloud security failures originate in communication gaps, unclear ownership, and organizational complexity rather than technical mistakes alone.', href: 'https://darastayscurious.substack.com/p/cloud-misconfigurations-are-usually' },\n        { num: '04', title: \"Identity's the New Perimeter (And Most People Still Think in Walls)\", desc: 'How cloud computing shifted security from defending networks to managing trust, access, and identity in increasingly distributed environments.', href: 'https://darastayscurious.substack.com/p/identitys-the-new-perimeter' },\n      ],\n      projects: [\n        { num: '01', name: 'PayGuard Financial Technologies', standard: 'PCI DSS v4.0', status: 'Complete', statusColor: accent, statusBorder: accent, blurb: 'In payments, a control only works if people can actually follow it. This scenario shows how human behavior and workflow friction - not just policy - decide whether PCI DSS controls hold or fail.', href: 'https://github.com/DaraStaysCurious/grc-payguard-pcidss', target: '_blank' },\n        { num: '02', name: 'CareStream Health Technologies', standard: 'SOC 2 Type II · HIPAA', status: 'Complete', statusColor: accent, statusBorder: accent, blurb: 'Under clinician workflow pressure, the safe path has to be the easy path. A SOC 2 + HIPAA scenario mapping how care-delivery stress turns into security risk.', href: 'https://github.com/DaraStaysCurious/grc-carestream-soc2', target: '_blank' },\n        { num: '03', name: 'Risk Assessment Methodology', standard: 'Fine-Kinney × NIST 800-30', status: 'Complete', statusColor: accent, statusBorder: accent, blurb: 'An original risk-scoring framework that adds Exposure as a variable to better capture real-world likelihood.', href: 'https://github.com/DaraStaysCurious/risk-assessment-methodology', target: '_blank' },\n        { num: '04', name: 'TrustPath Usable Security', standard: 'Usable Security', status: 'Up next', statusColor: accent, statusBorder: accent, blurb: 'A usable-security concept with a dedicated human-risk layer - applying UX research methods to cut friction and design controls people actually use.', href: 'https://github.com/DaraStaysCurious', target: '_blank' },\n        { num: '05', name: 'Convergence Capstone', standard: 'ISO 27001 · SOC 2 · PCI DSS v4.0 · NIST CSF', status: 'Planned', statusColor: '#6B6B6B', statusBorder: '#5c5c5c', blurb: 'A capstone pulling the full methodology together across ISO 27001, SOC 2, PCI DSS v4.0, and NIST CSF.', href: 'https://github.com/DaraStaysCurious', target: '_blank' },\n        { num: '06', name: 'Secure Design Framework', standard: 'Human-Centered Security', status: 'Planned', statusColor: '#6B6B6B', statusBorder: '#5c5c5c', blurb: 'Formalizing a human-centered approach to secure product design as a standalone reference framework.', href: 'https://github.com/DaraStaysCurious', target: '_blank' },\n      ],\n      links: [\n        { label: 'Email', value: 'dara.thomas.grc@gmail.com', href: 'mailto:dara.thomas.grc@gmail.com' },\n        { label: 'LinkedIn', value: 'in/darafthomas', href: 'https://www.linkedin.com/in/darafthomas/' },\n        { label: 'GitHub', value: 'DaraStaysCurious', href: 'https://github.com/DaraStaysCurious' },\n        { label: 'Substack', value: 'darastayscurious', href: 'https://darastayscurious.substack.com/' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
